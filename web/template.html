<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ECMWF forecasts</title>
  <link rel="stylesheet" href="./static/vaerkart.css" type="text/css" />
  <script src="./static/vaerkart.js" type="text/javascript"></script>
  <script type="text/javascript">
	var prefix = '{{ initvar.prefix }}';
	var date_fc = '{{ date_begin|date:"YmdH" }}';
	var date_vis = '{{ date_init|date:"YmdH" }}';
	var avail_fcs = [{% for fc in fclist %}'{{ fc|date:"YmdH" }}'{% if not forloop.last %}, {% endif %}{% endfor %}];
	var avail_tims = [{% for tim in timlist %}'{{ tim|date:"YmdH" }}'{% if not forloop.last %}, {% endif %}{% endfor %}];
	var plotdir = '{{ plotdir }}';
  </script>
</head>
<body>
  <div class="header">
    <select id="fcselect" name="fcselect" onchange="chfc(this.value);">{% for fc in fclist %}
      <option value="{{ fc|date:"YmdH" }}"{% if forloop.first %} selected="selected"{% endif %}>From: {{ fc|date:"d M Y, H" }} UTC</option>{% endfor %}
    </select>
    <select id="varselect" name="varselect" onchange="chvar(this.value);">{% for var in varlist %}
      <option value="{{ var.prefix }}"{% if forloop.first %} selected="selected"{% endif %}>{{ var.name }}{% if var.level %} on {{ var.level }}{% endif %}</option>{% endfor %}
    </select>
    <p>Lead time:</p>
    <ul id="timselect">{% for tim, lead in timlist_link %}
      <li><a href="javascript:chtim('{{ tim|date:"YmdH" }}')">{{ lead }}</a></li>{% endfor %}
    </ul>
  </div>
  <div class="content">
    <h1 id="vartitle">{{ initvar.name }}{% if initvar.level %} on {{ initvar.level }}{% endif %}</h1>
    <h2 id="timtitle">Forecast from {{ date_init|date:"d M Y, H" }} UTC for {{ date_begin|date:"d M Y, H" }} UTC</h2>
    <div class="map"><img id="map" src="./{{ plotdir }}/ec_for_{{ initvar.prefix }}_from_{{ date_init|date:"YmdH" }}_for_{{ date_begin|date:"YmdH" }}.png" /></div>
  </div>
</body>
</html>
