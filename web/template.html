<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ECMWF forecasts</title>
  <link rel="stylesheet" href="./static/vaerkart.css" type="text/css" />
  <script src="./static/jquery.js" type="text/javascript"></script>
  <script src="./static/moment.js" type="text/javascript"></script>
  <script src="./static/vaerkart.js" type="text/javascript"></script>
  <script type="text/javascript">
	var prefix = '{{ initvar.prefix }}';
	var date_fc = moment("{{ date_begin|date:"Y-m-d H" }}");
	var date_vis = moment("{{ date_init|date:"Y-m-d H" }}");
	var avail_fcs = [{% for fc in fclist %}moment("{{ fc|date:"Y-m-d H" }}"){% if not forloop.last %}, {% endif %}{% endfor %}];
	var avail_tims = [{% for tim in timlist %}moment("{{ tim|date:"Y-m-d H" }}"){% if not forloop.last %}, {% endif %}{% endfor %}];
	var plotdir = '{{ plotdir }}';
  </script>
</head>
<body>
  <div class="header">
    <select id="fcselect" name="fcselect" onchange="chfc(this.value);">{% for fc in fclist %}
      <option value="{{ forloop.counter0 }}"{% if forloop.first %} selected="selected"{% endif %}>From: {{ fc|date:"l, d M Y, H" }} UTC</option>{% endfor %}
    </select>
    <select id="varselect" name="varselect" onchange="chvar(this.value);">{% for var in varlist %}
      <option value="{{ var.prefix }}"{% if forloop.first %} selected="selected"{% endif %}>{{ var.name }}{% if var.level %} on {{ var.level }}{% endif %}</option>{% endfor %}
    </select>
  </div>
  <div class="content">
    <h1 id="vartitle">{{ initvar.name }}{% if initvar.level %} on {{ initvar.level }}{% endif %}</h1>
    <h2 id="timtitle">Forecast from {{ date_init|date:"l, d M Y, H" }} UTC for {{ date_begin|date:"l, d M Y, H" }} UTC</h2>
    <div class="plot">
      <div id="map_container" class="map">
	<img id="map" src="./{{ plotdir }}/ec_for_{{ initvar.prefix }}_from_{{ date_init|date:"YmdH" }}_for_{{ date_begin|date:"YmdH" }}.png" />
        <div id="legend_controls">
          <a href="">&#8505;</a>
        </div>
	<div id="time_controls">
	  <ul id="play_controls">
	    <li id="but_first"><a href="javascript:firsttim()">&#8739;&#8201;&#8810;</a></li> 
	    <li id="but_prev"><a href="javascript:prevtim()">&#8810;</a></li>
	    <li id="but_play"><a href="javascript:play()">&#8201;&#9658;</a></li>
	    <li id="but_pause" style="display: none;"><a href="javascript:pause()">&#10074;&#10074;</a></li>
	    <li id="but_next"><a href="javascript:nexttim()">&#8811;</a></li>
	  </ul><br />
          <p>Lead time:</p>
          <ul id="timselect">{% for tim, lead in timlist_link %}
            <li><a href="javascript:chtim({{ lead }})">{{ lead }}</a></li>{% endfor %}
          </ul>
	</div>
      </div>
      <img id="cbar" src="./static/deco/cbar_{{ initvar.prefix }}.png" />
    </div>    
  </div>
</body>
</html>
