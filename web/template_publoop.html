<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GFI forecast maps</title>
  <link rel="stylesheet" href="./static/jqueryui.css" type="text/css" />
  <link rel="stylesheet" href="./static/vaerkart.css" type="text/css" />
  <script src="./static/jquery.js" type="text/javascript"></script>
  <script type="text/javascript">
var curidx = 0;
var cur_chapter = 0;
var sndpanel = {% if sndpanel %}true{% else %}false{% endif %};
var plotdir = '{{ plotdir }}';
var chapter_titles = { {% for chapter in chapters %}
  {{ chapter.idx }}: "{{ chapter.title }}",{% endfor %}
}
var chapter_briefs = { {% for chapter in chapters %}
  {{ chapter.idx }}: "{{ chapter.brief }}",{% endfor %}
}
var slides = [
  {% for slide in slides %}{
    title: "{{ slide.title }}", 
    init: "{{ slide.init }}", 
    valid: "{{ slide.valid }}", 
    lead: {{ slide.lead }}, 
    panels: [
      {% for panel in slide.panels %}{
        {% if panel.title %}title: "{{ panel.title }}", 
        {% endif %}fname: "{{ panel.fname }}", 
        cbar: "{{ panel.cbar }}",
        units: "{{ panel.units }}",
      },{% endfor %}
    ],
  },{% endfor %}
];
function next() {
  curidx = (curidx + 1) % slides.length;
  if ( curidx in chapter_titles ) {
    $('#overalltitle').text(chapter_titles[curidx]);
    if ( slides[curidx].panels.length > 1 ) {
      $('#panel_top_left').css('width', '49.5%');
      $('#panel_top_right').css('display', 'inline-block').css('width', '49.5%');
    }
    else {
      $('#panel_top_left').css('width', '100%');
      $('#panel_top_right').css('display', 'none');
    }

    $('#publoop_chapter_'+cur_chapter).removeClass('active');
    cur_chapter = curidx;
    $('#publoop_chapter_'+cur_chapter).addClass('active');
  }
  
  progress = ((curidx+0.5)*100)/slides.length;
  $('#publoop_progress').css('width', progress.toFixed(2) + '%');

  $('#map1').attr('src', plotdir+'/'+slides[curidx].panels[0].fname);
  $('#cbar1').attr('src', './static/deco/'+slides[curidx].panels[0].cbar); 
  $('#cbar_units1').text('['+slides[curidx].panels[0].units+']'); 
  if ( slides[curidx].panels.length > 1 ) {
    $('#map2').attr('src', plotdir+'/'+slides[curidx].panels[1].fname);
    $('#cbar2').attr('src', './static/deco/'+slides[curidx].panels[1].cbar); 
    $('#cbar_units2').text('['+slides[curidx].panels[1].units+']'); 
  }
  $('#timtitle').text('Forecast from '+slides[curidx].init+' for '+slides[curidx].valid+' [+'+slides[curidx].lead+'h]');
}
function play() {
	var maxidx = slides.length-1;
	
	for (i=1; i <= maxidx; i++) {
		setTimeout(next, i*1500);
	}

  setTimeout(play, (maxidx+1)*1500);
}
$(play);
  </script>
</head>
<body>
  <div class="progress_bar">
    <div id="publoop_progress" class="progress_bar_indicator" style="width: 1%;"></div>
  </div>
  <div class="publoop_chapters">{% for chapter in chapters %}<div id="publoop_chapter_{{ chapter.idx }}" style="width: {{ chapter.width }}%;"{% if loop.first %} class="active"{% endif %}>{{ chapter.brief }}</div>{% endfor %}</div>
 <div class="header">
   <h1 id="overalltitle" class="publoop">{{ firsttitle }}</h1>
   <h2 id="timtitle" class="publoop">Forecast from {{ first.init }} for {{ first.valid }} [+{{ first.lead }}h]</h2>
 </div>
 <div class="content">
   <div class="panel panel_top panel_left" id="panel_top_left" style="width={% if sndpanel %}49.5{% else %}100{% endif %}%; display: inline-block;">
    {% if fstpanel.title %}<h1 id="vartitle1">{{ fstpanel.title }}</h1>{% endif %}
    <div class="plot">
      <div id="map_container1" class="map">
        <img id="map1" src="{{ plotdir }}/{{ fstpanel.fname }}" />
      </div>
      <div class="cbar_container">
        <img class="cbar" id="cbar1" src="./static/deco/{{ fstpanel.cbar }}" />
        <div class="cbar_units" id="cbar_units1">[x]</div>
      </div>
    </div> <!-- plot -->
  </div> <!-- panel -->
  <div class="panel panel_top panel_right" id="panel_top_right" style="width=49.5%; {% if not sndpanel %}display: none;{% else %}display: inline-block;{% endif %}">
    {% if fstpanel.title %}<h1 id="vartitle2">{{ sndpanel.title }}</h1>{% endif %}
    <div class="plot">
      <div id="map_container2" class="map">
        <img id="map2" src="{{ plotdir }}/{{ sndpanel.fname }}" />
      </div>
      <div class="cbar_container">
        <img class="cbar" id="cbar2" src="./static/deco/{{ sndpanel.cbar }}" />
        <div class="cbar_units" id="cbar_units2">[x]</div>
      </div>
    </div> <!-- plot -->
  </div> <!-- panel -->
</body>
</html>
